services:
  notes-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME}/notes-app:${APP_VERSION:-latest}
    container_name: notes-app
    ports:
      - "8081:8081"
    depends_on:
      notes-postgres:
        condition: service_healthy
      notes-redis:
        condition: service_healthy
      notes-rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_MESSAGING_INITIALIZE_SCHEMA: ${APP_MESSAGING_INITIALIZE_SCHEMA:-false}

      DB_URL: jdbc:postgresql://notes-postgres:5432/NoteApp
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH: ${JWT_REFRESH}

      REDIS_HOST: notes-redis
      REDIS_PORT: 6379


      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      RABBIT_HOST: notes-rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USERNAME: ${RABBIT_USERNAME}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      RABBIT_STOMP_PORT: 61613

    networks:
      - notes-network

  notes-postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: NoteApp
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - notes-network

  notes-redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - notes-network


  notes-rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_stomp &&
             rabbitmq-server"
    ports:
      - "5673:5672" #Connect to RabbitMQ to send and receive messages
      - "15672:15672"
      - "61614:61613"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - notes-network

volumes:
  pg-data:
  redis-data:
  rabbit-data:

networks:
  notes-network:
    driver: bridge
