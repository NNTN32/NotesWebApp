name: Build & Integration Test Notes App

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'codex/**']

permissions:
  contents: read

# Let production promotion finish; only cancel superseded feature/PR checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/ci/*.test.mjs

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: notesWeb
    # Disposable CI infrastructure only. No production credentials on PRs.
    env:
      DOCKERHUB_USERNAME: notesweb-ci # local compose image namespace only; nothing is pushed
      APP_VERSION: ci
      APP_MESSAGING_INITIALIZE_SCHEMA: 'true'
      MESSAGING_TEST_DB_URL: jdbc:postgresql://localhost:5433/NoteApp
      MESSAGING_TEST_DB_USERNAME: postgres
      MESSAGING_TEST_DB_PASSWORD: ci-only-postgres
      MESSAGING_TEST_RABBIT_HOST: localhost
      MESSAGING_TEST_RABBIT_PORT: '5673'
      MESSAGING_TEST_RABBIT_USERNAME: ci_worker
      MESSAGING_TEST_RABBIT_PASSWORD: ci-only-rabbit
      MESSAGING_TEST_REDIS_PORT: '6380'
      DB_URL: jdbc:postgresql://localhost:5433/NoteApp
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-postgres
      JWT_SECRET: Y2ktb25seS1qd3Qta2V5LTMyLWJ5dGVzLW5vdC1wcm9kdWN0aW9u
      JWT_EXPIRATION: '86400000'
      JWT_REFRESH: '604800000'
      REDIS_HOST: localhost
      REDIS_PORT: '6380'
      RABBIT_HOST: localhost
      RABBIT_PORT: '5673'
      RABBIT_USERNAME: ci_worker
      RABBIT_PASSWORD: ci-only-rabbit
      RABBIT_STOMP_PORT: '61614'
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: notesWeb/pom.xml
      - name: Unit tests
        run: bash ./mvnw -B test '-Dtest=!*IntegrationTest,!NotesWebApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local CI image (no registry push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./notesWeb
          load: true
          platforms: linux/amd64
          tags: notesweb-ci/notes-app:ci
          cache-from: type=gha,scope=be-ci
          cache-to: type=gha,mode=max,scope=be-ci,ignore-error=true
      - name: Start disposable infrastructure and the built image
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Application smoke and integration tests
        run: |
          ready=false
          for attempt in {1..30}; do
            echo "Waiting for API ($attempt/30)"
            if curl --fail --silent --output /dev/null http://localhost:8081/actuator/health/readiness; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          bash ./mvnw -B test '-Dtest=*IntegrationTest,NotesWebApplicationTests' -Dspring.profiles.active=test
      - name: Diagnose disposable application failures
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 notes-app notes-rabbitmq notes-redis
          curl --silent --show-error --max-time 10 --include http://localhost:8081/actuator/health/readiness || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: notesWeb/target/surefire-reports/
      - name: Shutdown disposable CI infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans

  release-policy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.policy.outputs.merged }}
    steps:
      - name: Require main commit from a merged PR
        id: policy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            // GitHub can lag a few seconds linking a fresh merge commit to its PR; retry before calling it a direct push.
            let merged = false;
            for (let attempt = 0; attempt < 6 && !merged; attempt++) {
              if (attempt) await new Promise(resolve => setTimeout(resolve, 10_000));
              const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                ...context.repo, commit_sha: context.sha, per_page: 100
              });
              merged = prs.some(pr => pr.merged_at && pr.base.ref === 'main'
                && pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
                && pr.merge_commit_sha === context.sha);
            }
            core.setOutput('merged', String(merged));
            if (!merged) core.notice('Direct main push: tests only; no latest publication or production deployment.');

  publish:
    needs: [build-and-test, deployment-tests, release-policy]
    # release-policy is skipped on feature pushes; PRs never log in or publish.
    if: >-
      always() && needs.build-and-test.result == 'success' &&
      needs.deployment-tests.result == 'success' && github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      (startsWith(github.ref, 'refs/heads/feature/') ||
       (github.ref == 'refs/heads/main' && needs.release-policy.outputs.merged == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nntn32/notes-app
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image tags (latest is promoted separately)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested revision
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./notesWeb
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=be-release
          cache-to: type=gha,mode=max,scope=be-release,ignore-error=true
      - name: Smoke the exact published digest on both architectures
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p reports
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > reports/manifest.json
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#linux/}"
            child=$(jq -er --arg arch "$architecture" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' reports/manifest.json)
            docker pull --platform "$platform" "$IMAGE@$child"
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$child")
            test "$revision" = "$GITHUB_SHA"
            docker run --rm --platform "$platform" --entrypoint java "$IMAGE@$child" -version
            jq -n --arg arch "$architecture" --arg digest "$child" --arg revision "$revision" \
              '{architecture:$arch,digest:$digest,revision:$revision}' > "reports/smoke-$architecture.json"
          done
      - name: Record immutable release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            import assert from "node:assert/strict";
            assert.match(process.env.DIGEST, /^sha256:[a-f0-9]{64}$/);
            writeFileSync("release.json", JSON.stringify({revision: process.env.GITHUB_SHA,
              image: `${process.env.IMAGE}@${process.env.DIGEST}`, runId: process.env.GITHUB_RUN_ID,
              platforms: ["linux/amd64", "linux/arm64"]}, null, 2));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release
          path: |
            release.json
            reports/
          retention-days: 90

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ProductBE
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nntn32/notes-app
    concurrency:
      group: be-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Reject superseded main run before deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.commit.sha !== context.sha) core.setFailed('Main has advanced; do not deploy this older run.');
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the last verified digest for rollback
        id: previous
        run: |
          # latest only ever points at a digest that passed this job; absent on the first CapRover release.
          if digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{ .Manifest.Digest }}' 2>/dev/null); then
            echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy exact digest to CapRover and verify revision, readiness and public contracts
        env:
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          RELEASE_IMAGE: ghcr.io/nntn32/notes-app@${{ needs.publish.outputs.digest }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: node scripts/ci/deploy.mjs
      - name: Promote only the verified digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
      - name: Preserve sanitized deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-deployment
          path: deployment.json
          retention-days: 90

  notify:
    # One Discord message (#ci_be-alert) per run, green or red. Fork/Dependabot runs get no secret and skip.
    needs: [deployment-tests, build-and-test, release-policy, publish, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Post CI result to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RESULTS: ${{ toJSON(needs) }}
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/notify-discord.mjs
